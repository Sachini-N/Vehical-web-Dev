    function App() {
      // Default to Home Screen for instant diagnostic view
      const [currentScreen, setCurrentScreen] = useState("home");
      const [liveViewMode, setLiveViewMode] = useState("cluster"); // 'cluster' or 'grid'

      // Driver profile (starts null until driver signs in or registers)
      const [currentUser, setCurrentUser] = useState(null);

      // Active vehicle for OBD-II scan (clean state)
      const [selectedVehicle, setSelectedVehicle] = useState({
        brand: "SUZUKI",
        model: "Wagon R",
        licensePlate: "",
        year: 2020
      });

      // Bluetooth State (disconnected until user pairs adapter)
      const [connectedDevice, setConnectedDevice] = useState(null);
      const [isConnected, setIsConnected] = useState(false);
      const [isBluetoothScanning, setIsBluetoothScanning] = useState(false);
      const [connectingAddress, setConnectingAddress] = useState(null);
      const [bluetoothLogs, setBluetoothLogs] = useState([
        "System ready. Bluetooth SPP Profile enabled.",
        "Listening on RFCOMM UUID 00001101-0000-1000-8000-00805F9B34FB"
      ]);

      const [discoveredDevices, setDiscoveredDevices] = useState([]);

      // Registration Form State
      const [authMode, setAuthMode] = useState("register"); // 'register' or 'login'
      const [regFullName, setRegFullName] = useState("");
      const [regEmail, setRegEmail] = useState("");
      const [regPassword, setRegPassword] = useState("");
      const [regPhone, setRegPhone] = useState("");
      const [regBrand, setRegBrand] = useState("TOYOTA");
      const [regModel, setRegModel] = useState("Prius");
      const [regPlate, setRegPlate] = useState("");
      const [regYear, setRegYear] = useState("");
      const [regFuel, setRegFuel] = useState("Petrol / Hybrid");
      const [regMileage, setRegMileage] = useState("");
      const [showAddCarModal, setShowAddCarModal] = useState(false);

      // Diagnostic Faults (clean state: 0 active faults)
      const [activeDTCs, setActiveDTCs] = useState([]);
      const [selectedFault, setSelectedFault] = useState(null);
      const [isScanningVehicle, setIsScanningVehicle] = useState(false);

      // History (empty until scans are performed)
      const [history, setHistory] = useState([]);

      // Sensors (0 / idle until connected)
      const [sensors, setSensors] = useState({
        rpm: 0,
        speed: 0,
        ect: 0,
        iat: 0,
        tps: 0,
        maf: 0,
        map: 0,
        o2: 0
      });

      // Stream jitter (only active when connected)
      useEffect(() => {
        if (!isConnected) {
          setSensors({
            rpm: 0,
            speed: 0,
            ect: 0,
            iat: 0,
            tps: 0,
            maf: 0,
            map: 0,
            o2: 0
          });
          return;
        }
        const interval = setInterval(() => {
          setSensors(prev => ({
            ...prev,
            rpm: Math.round(1350 + Math.random() * 140),
            ect: Math.min(95, prev.ect + (Math.random() > 0.8 ? 1 : 0)),
            tps: Number((14.0 + Math.random() * 1.5).toFixed(1)),
            maf: Number((2.7 + Math.random() * 0.3).toFixed(1)),
            map: Math.round(35 + Math.random() * 3),
            o2: Number((0.65 + Math.random() * 0.15).toFixed(2))
          }));
        }, 1100);
        return () => clearInterval(interval);
      }, [isConnected]);

      // Bluetooth scan
      const runBluetoothScan = () => {
        setIsBluetoothScanning(true);
        setBluetoothLogs(prev => [...prev, "🔍 Scanning nearby ELM327 OBD-II adapters..."]);
        setTimeout(() => {
          setIsBluetoothScanning(false);
          setBluetoothLogs(prev => [...prev, `✓ Found ${discoveredDevices.length} adapters.`]);
        }, 1600);
      };

      const connectDevice = (dev) => {
        setConnectingAddress(dev.address);
        setBluetoothLogs([`Connecting to ${dev.name}...`, "Opening RFCOMM SPP..."]);
        setTimeout(() => {
          setBluetoothLogs(prev => [...prev, "> AT Z", "< ELM327 v1.5 OK", "> AT SP 0", "< OK (CAN 11/500)", "> 0100", "< 41 00 BE 3F B8 11", "✓ Connected to Vehicle ECU!"]);
          setIsConnected(true);
          setConnectedDevice(dev);
          setConnectingAddress(null);
          setCurrentScreen("home");
        }, 1200);
      };

      // Handle User + Vehicle Registration
      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        if (authMode === "register") {
          if (!regFullName.trim() || !regEmail.trim() || !regPassword.trim()) {
            alert("Please enter Full Name, Email and Password.");
            return;
          }
          if (!regPlate.trim()) {
            alert("Please enter vehicle license plate number.");
            return;
          }

          const newUser = {
            _id: "user_" + Date.now(),

                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="font-bold text-sm text-white">{h.vehicle}</h4>
                        <p className="text-[11px] text-slate-400">{h.date}</p>
                      </div>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                        h.status === "Fault Detected" ? "bg-rose-600/30 text-rose-300 border-rose-500/40" : "bg-emerald-600/30 text-emerald-300 border-emerald-500/40"
                      }`}>
                        {h.status}
                      </span>
                    </div>
                    <div className="flex items-center space-x-1.5 pt-1">
                      <span className="text-xs text-slate-400">DTC:</span>
                      {h.codes.map((c) => (
                        <span key={c} className="text-xs font-mono font-bold bg-slate-800 text-rose-400 px-2 py-0.5 rounded">{c}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* ============================================================== */}
            {/* 9. VEHICLE SELECTION MODAL */}
            {/* ============================================================== */}
            {currentScreen === "vehicleSelect" && (
              <div className="space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h2 className="text-lg font-bold">Select Database Model (28 Models)</h2>
                  <button onClick={() => setCurrentScreen("home")} className="text-slate-400 hover:text-white font-bold p-1">✕</button>
                </div>
                <div className="space-y-2 max-h-[670px] overflow-y-auto custom-scroll pr-1">
                  {VEHICLES.map((v, i) => (
                    <div
                      key={i}
                      onClick={() => {
                        setSelectedVehicle({
                          brand: v.brand,
                          model: v.model,
                          licensePlate: selectedVehicle.licensePlate || ""
                        });
                        setCurrentScreen("home");
                      }}
                      className={`p-3 rounded-xl border flex justify-between items-center cursor-pointer transition-all ${
                        selectedVehicle.brand === v.brand && selectedVehicle.model === v.model
                          ? "bg-sky-950/60 border-sky-500 text-sky-200"
                          : "bg-[#101b2d] border-slate-800 hover:border-slate-700 text-slate-200"
                      }`}
                    >
                      <div>
                        <span className="text-[10px] font-bold uppercase text-sky-400 tracking-wider">{v.brand}</span>
                        <div className="font-semibold text-sm">{v.model}</div>
                      </div>
                      <span className="text-slate-400 text-base">›</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Bottom App Navigation Bar (Always visible for easy navigation) */}
          <div className="grid grid-cols-5 bg-white border-t border-slate-200 py-2.5 text-center text-[10px] text-slate-500 shadow-lg">
            <button 
              onClick={() => setCurrentScreen("home")}
              className={`flex flex-col items-center transition-all ${currentScreen === "home" ? "text-blue-600 font-extrabold scale-105" : "hover:text-slate-800 font-semibold"}`}
            >
              <span className="text-xl">🏠</span>
              <span>Home</span>
            </button>
            <button 
              onClick={() => setCurrentScreen("live")}
              className={`flex flex-col items-center transition-all ${currentScreen === "live" ? "text-blue-600 font-extrabold scale-105" : "hover:text-slate-800 font-semibold"}`}
            >
              <span className="text-xl">📈</span>
              <span>Live Data</span>
            </button>
            <button 
              onClick={() => setCurrentScreen("faults")}
              className={`flex flex-col items-center transition-all ${currentScreen === "faults" ? "text-rose-600 font-extrabold scale-105" : "hover:text-slate-800 font-semibold"}`}
            >
              <span className="text-xl">⚠️</span>
              <span>Faults</span>
            </button>
            <button 
              onClick={() => setCurrentScreen("history")}
              className={`flex flex-col items-center transition-all ${currentScreen === "history" ? "text-emerald-600 font-extrabold scale-105" : "hover:text-slate-800 font-semibold"}`}
            >
              <span className="text-xl">🕒</span>
              <span>History</span>
            </button>
            <button 
              onClick={() => setCurrentScreen("garage")}
              className={`flex flex-col items-center transition-all ${currentScreen === "garage" ? "text-indigo-600 font-extrabold scale-105" : "hover:text-slate-800 font-semibold"}`}
            >
              <span className="text-xl">🚘</span>
              <span>Garage</span>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
